on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          set -e
          for f in $(find . -name '*.sh' -not -path './.git/*') fanctl install.sh; do
            bash -n "$f"
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # fanctl + install.sh are sourced from each other (fanctl uses ipmitool,
          # install.sh uses find/lsmod), so follow sources with -x.
          shellcheck -x fanctl install.sh
          # examples/ is intentionally standalone and may diverge from fanctl's
          # protocol bytes; not part of the package contract.
          shellcheck examples/temp-monitor.sh
